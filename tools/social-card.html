<!doctype html>
<!-- Renders docs/og.png (?) and docs/media/launch-poster.jpg (?poster). See tools/render-social.sh. -->
<html lang="id">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F6F9; --paper: #E8ECF2; --ink: #131F37; --muted: #626E7E; --line: #DEE3EB; --brand: #131F37; --leaf: #192D52; --sos: #D61E20; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", sans-serif; color: var(--ink); position: relative;
    background:
      radial-gradient(circle at 84% 48%, rgba(214,30,32,.14), transparent 42%),
      radial-gradient(circle at 0% 100%, rgba(19,31,55,.08), transparent 40%),
      var(--bg);
  }
  .rings { position: absolute; left: 1010px; top: 315px; }
  .rings i { position: absolute; border: 2px solid rgba(19,31,55,.10); border-radius: 50%; transform: translate(-50%,-50%); }
  .copy { position: absolute; left: 72px; top: 64px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; color: var(--brand); }
  .brand img { width: 64px; }
  h1 { margin-top: 44px; font-size: 62px; line-height: 1.04; letter-spacing: -2.2px; font-weight: 800; }
  h1 em { font-style: normal; color: var(--sos); }
  .lead { margin-top: 22px; font-size: 25px; line-height: 1.4; color: var(--muted); font-weight: 500; }
  .chips { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 10px; }
  .chips span { padding: 9px 16px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-weight: 700; font-size: 19px; }
  .chips .sos { background: var(--sos); border-color: var(--sos); color: #fff; }
  .phone {
    position: absolute; left: 860px; top: 52px; width: 290px; height: 630px;
    border-radius: 42px; background: #0C1322; padding: 11px; transform: rotate(4deg);
    box-shadow: 0 40px 70px -30px rgba(19,31,55,.55);
  }
  .phone img { width: 100%; border-radius: 32px; display: block; }
  .play { display: none; }

  html.poster, html.poster body { width: 1200px; height: 675px; }
  html.poster .rings { top: 338px; }
  html.poster .copy { top: 80px; }
  html.poster .phone { top: 70px; }
</style>
</head>
<body>
  <div class="rings"><i style="width:360px;height:360px"></i><i style="width:560px;height:560px"></i><i style="width:760px;height:760px"></i></div>
  <div class="copy">
    <div class="brand"><img src="../docs/brand/mark.png" alt="">Growth Internal</div>
    <h1>Koordinasi Tim Lapangan saat <em>tanpa sinyal.</em></h1>
    <p class="lead">Walkie-talkie, telepon, chat, instruksi pos, dan panggilan prioritas untuk Outbound & Training Tim Growth Indonesia.</p>
  </div>
  <div class="chips"><span>Walkie-talkie</span><span>Telepon</span><span>Instruksi</span><span>Kompas</span><span class="sos">Prioritas</span></div>
  <div class="phone"><img src="../docs/screenshots/2-grup-dan-chat.png" alt=""></div>
  <script>if (location.search.includes('poster')) document.documentElement.classList.add('poster');</script>
</body>
</html>
