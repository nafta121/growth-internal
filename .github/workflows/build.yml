name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build tools from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-23 aapt dalvik-exchange apksigner zipalign

      - name: Build debug APK
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: saling-jaga-debug-apk
          path: build/saling-jaga-debug.apk

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Protocol tests and screenshots
        working-directory: tools/screenshot-tests
        run: gradle test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/screenshot-tests/out/
