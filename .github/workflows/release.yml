name: Release APK

# Every push to main publishes the APK to the GitHub Release for the current versionName,
# so README and the website can link to .../releases/latest/download/growth-internal.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build tools from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-23 aapt dalvik-exchange apksigner zipalign

      - name: Restore release key (optional)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 belum diisi, APK ditandatangani kunci sementara dan tidak bisa meng-update rilis sebelumnya."
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.SIGNING_KS_PASS || 'android' }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASS || secrets.SIGNING_KS_PASS || 'android' }}
        run: |
          # Strictly increasing per release run, so phones install each APK as an update.
          export VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          ./build.sh
          cp build/growth-internal-debug.apk build/growth-internal.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'android:versionName="[^"]*"' app/src/main/AndroidManifest.xml | cut -d'"' -f2)
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Growth Internal $VERSION" --latest \
              --notes "APK Growth Internal $VERSION untuk Android 6.0 ke atas. Unduh **growth-internal.apk** di bawah, lalu ikuti [cara instal](https://github.com/${GITHUB_REPOSITORY}#cara-instal-di-hp). Versi MVP: belum diuji lapangan di banyak HP."
          fi
          (cd build && sha256sum growth-internal.apk > growth-internal.apk.sha256)
          SHA=$(cut -d' ' -f1 build/growth-internal.apk.sha256)
          VC=$(aapt dump badging build/growth-internal.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          CERT=$(apksigner verify --print-certs build/growth-internal.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          gh release upload "$TAG" build/growth-internal.apk build/growth-internal.apk.sha256 --clobber
          gh release edit "$TAG" --notes "APK Growth Internal $VERSION untuk Android 6.0 ke atas. Unduh **growth-internal.apk** di bawah, lalu ikuti [cara instal](https://github.com/${GITHUB_REPOSITORY}#cara-instal-di-hp).

          ### Perubahan di v$VERSION
          - **Keamanan Thread & Handshake Grup (\`Hub\`)**: Menutup celah *race condition* pemeriksaan nama duplikat saat \`HELLO\` serta melaporkan penolakan secara eksplisit bila soket diputus sebelum *handshake* selesai (mis. saat grup penuh).
          - **Manajemen Memori Audio (\`Voice\`, \`MainActivity\`)**: Sinkronisasi inisialisasi \`AudioTrack\`, pemeriksaan \`STATE_INITIALIZED\`, dan pelepasan otomatis track audio saat anggota keluar dari grup (\`voice.drop\`).
          - **Performa UI & Peta (\`RadarView\`, \`Avatars\`, \`MapView\`)**: Menghapus alokasi bitmap per-*frame* di kompas radar, menambahkan \`LruCache\` serta koreksi orientasi EXIF pada avatar profil, dan meningkatkan cache ubin peta offline menjadi 120 ubin.
          - **Pembersihan Repositori**: Menghapus skrip usang \`tools/render-social.sh\` & \`tools/social-card.html\` serta menambahkan [\`CHANGELOG.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).

          ### Cek keaslian file
          - Versi build (versionCode): $VC
          - SHA-256 APK: \`$SHA\`
          - Sidik jari sertifikat penandatangan (SHA-256): \`$CERT\`
          - Dibangun otomatis oleh GitHub Actions dari commit [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}), [log build](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
