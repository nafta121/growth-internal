name: Usul fitur
description: Ide peningkatan fitur untuk mendukung operasional lapangan Tim Growth Indonesia.
title: "[Usul] "
labels: [enhancement]
body:
  - type: textarea
    id: kebutuhan
    attributes:
      label: Kebutuhan lapangan apa yang belum terpenuhi?
      description: Ceritakan situasinya saat kegiatan Outbound atau Training berlangsung.
      placeholder: "Saat rotasi pos di area camping ground, Tim perlu melihat..."
    validations:
      required: true
  - type: textarea
    id: usulan
    attributes:
      label: Usulan Anda
      description: Bagaimana menurut Anda aplikasi sebaiknya membantu Tim di lapangan?
  - type: dropdown
    id: pemakai
    attributes:
      label: Peran Anda di Tim Growth Indonesia
      multiple: true
      options:
        - PIC / Basecamp
        - Fasilitator / Co-Fasilitator Pos
        - Tim High Rope & Safety
        - Tim Logistik & Perlengkapan
        - Dokumentasi & Media
        - Lainnya
